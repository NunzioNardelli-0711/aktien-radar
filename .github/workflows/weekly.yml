name: Wochenlauf (Indexlisten + Fundamentaldaten)

on:
  schedule:
    - cron: "0 7 * * 6"   # Samstag früh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-store
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Universum und Fundamentaldaten aktualisieren
        run: bash .github/scripts/with-store.sh weekly
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
