name: Daytrading (Setups, Entry-Timer, Time Machine)

# Ein Lauf deckt die US-Sitzung ab: vor Börsenstart Setup-Scan über ~5.900 US-Aktien,
# ab 9:50 New York alle 5 Minuten Entry-Timer + ORB-Scan, Time Machine bei jedem Einstieg.
# Die stündlichen Starts sind ein Sicherheitsnetz: Läuft schon ein Lauf, wartet der nächste
# und übernimmt nahtlos, sobald der erste seine Laufzeit-Grenze erreicht.
on:
  schedule:
    - cron: "31 12-19 * * 1-5"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Laufzeit-Grenze in Minuten"
        default: "330"

permissions:
  contents: write

concurrency:
  group: radar-daytrade
  cancel-in-progress: false

jobs:
  daytrade:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Daytrading-Schleife über die US-Sitzung
        run: bash .github/scripts/with-store.sh daytrade --max-minutes "${{ inputs.max_minutes || '330' }}"
        env:
          STORE_BRANCH: daytrade
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
