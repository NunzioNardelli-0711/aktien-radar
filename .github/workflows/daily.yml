name: Tageslauf (Basisdaten + Watchlist)

on:
  schedule:
    - cron: "20 5 * * 1-5"   # vor Xetra-Eröffnung (07:20 Sommer / 06:20 Winter MEZ)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-store
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Basisdaten, Watchlist, ggf. Fundamentaldaten
        run: bash .github/scripts/with-store.sh daily
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
