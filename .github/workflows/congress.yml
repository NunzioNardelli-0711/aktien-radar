name: Kongress-Aktiengeschäfte (Pelosi & Co.)

on:
  schedule:
    - cron: "17 13,17,22 * * 1-5"   # dreimal pro Werktag, neue Meldungen kommen tagsüber (New York)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-congress
  cancel-in-progress: false

jobs:
  congress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pdftotext (zum Lesen der PDF-Meldungen)
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Neue Meldungen lesen
        run: bash .github/scripts/with-store.sh congress
        env:
          STORE_BRANCH: congress
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
